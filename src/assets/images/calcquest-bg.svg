  <g>
    <rect x="116" y="176" width="12" height="24" fill="#5C3A18" />
    <rect x="98" y="152" width="48" height="28" fill="#2E8B57" />
    <rect x="106" y="136" width="32" height="20" fill="#3CB371" />

    <rect x="212" y="182" width="12" height="22" fill="#5C3A18" />
    <rect x="196" y="160" width="44" height="24" fill="#2E8B57" />
    <rect x="204" y="144" width="28" height="18" fill="#3CB371" />

    <rect x="648" y="174" width="14" height="26" fill="#5C3A18" />
    <rect x="628" y="148" width="54" height="28" fill="#2E8B57" />
    <rect x="638" y="130" width="34" height="20" fill="#3CB371" />

    <rect x="732" y="184" width="12" height="22" fill="#5C3A18" />
    <rect x="716" y="162" width="44" height="24" fill="#2E8B57" />
  </g>

  <!-- Glowing Knowledge Crystal Shrine -->
  <polygon points="484,172 500,144 516,172 500,200" fill="#4EF2D2" />
  <polygon points="490,172 500,152 510,172 500,192" fill="#E0FFFF" />

  <!-- Pixel Explorer Hero & Quest Marker on the Bridge -->
  <rect x="342" y="172" width="20" height="18" fill="#F5B82E" />
  <rect x="350" y="175" width="4" height="8" fill="#231A12" />
  <rect x="350" y="185" width="4" height="3" fill="#231A12" />
  <rect x="344" y="196" width="16" height="14" fill="#F5C6A5" />
  <rect x="342" y="192" width="20" height="8" fill="#B83B2A" />
  <rect x="342" y="210" width="20" height="14" fill="#1D63D8" />
</svg>
