  <polygon points="130,210 240,86 350,210" fill="#372C6A" />
  <polygon points="220,104 240,86 260,104" fill="#E3F2E7" />
  <polygon points="310,210 430,96 550,210" fill="#2B2254" />
  <polygon points="480,210 610,78 740,210" fill="#372C6A" />
  <polygon points="588,98 610,78 632,98" fill="#F5B82E" />
  <polygon points="660,210 760,115 840,210" fill="#2B2254" />

  <!-- Pixel Clouds -->
  <g fill="#5E548E" opacity="0.75">
    <rect x="88" y="82" width="64" height="16" />
    <rect x="104" y="70" width="32" height="12" />
    <rect x="410" y="66" width="80" height="16" />
    <rect x="426" y="54" width="48" height="12" />
  </g>

  <!-- Citadel Tower on Right Hill -->
  <rect x="520" y="124" width="48" height="76" fill="#4A3B32" />
  <rect x="514" y="114" width="60" height="14" fill="#6E4726" />
  <polygon points="510,114 544,82 578,114" fill="#B83B2A" />
  <rect x="536" y="140" width="16" height="24" fill="#F5B82E" />

  <!-- Rolling Emerald RPG Hills -->
  <rect x="0" y="188" width="800" height="132" fill="#1E5E3A" />
  <rect x="0" y="212" width="800" height="108" fill="#266B3E" />
  <rect x="0" y="246" width="800" height="74" fill="#194A2A" />

