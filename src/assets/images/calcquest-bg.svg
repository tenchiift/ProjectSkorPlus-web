  <polygon points="310,188 370,188 450,320 250,320" fill="url(#river)" />
  <rect x="284" y="218" width="144" height="28" fill="#8C5A2B" />
  <rect x="284" y="212" width="144" height="8" fill="#C89B54" />
  <rect x="296" y="202" width="10" height="16" fill="#6E4726" />
  <rect x="350" y="202" width="10" height="16" fill="#6E4726" />
  <rect x="406" y="202" width="10" height="16" fill="#6E4726" />

