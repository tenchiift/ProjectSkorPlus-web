<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A103C" />
      <stop offset="55%" stop-color="#2E236C" />
      <stop offset="100%" stop-color="#433D8B" />
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E56A0" />
      <stop offset="50%" stop-color="#3696BF" />
      <stop offset="100%" stop-color="#1E56A0" />
    </linearGradient>
  </defs>

  <!-- Night/Twilight Pixel RPG Sky -->
  <rect width="800" height="320" fill="url(#sky)" />

  <!-- Pixel Stars & Math Runes -->
  <rect x="60" y="28" width="8" height="8" fill="#F5B82E" />
  <rect x="140" y="52" width="6" height="6" fill="#FFFDF8" />
  <rect x="230" y="22" width="8" height="8" fill="#7CF3A0" />
  <rect x="340" y="44" width="6" height="6" fill="#F5B82E" />
  <rect x="480" y="24" width="8" height="8" fill="#FFFDF8" />
  <rect x="590" y="48" width="8" height="8" fill="#F5B82E" />
  <rect x="710" y="26" width="6" height="6" fill="#7CF3A0" />
  <rect x="750" y="64" width="8" height="8" fill="#FFFDF8" />

  <!-- Glowing Pixel Moon / Knowledge Core -->
  <rect x="636" y="36" width="64" height="64" fill="#F5B82E" opacity="0.25" />
  <rect x="644" y="44" width="48" height="48" fill="#FFD966" />
  <rect x="652" y="52" width="32" height="32" fill="#FFFDF8" />

